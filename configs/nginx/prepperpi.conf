server {
  listen 80 default_server;
  server_name _;

  location / {
    proxy_pass http://127.0.0.1:5001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /kiwix/ {
    # No trailing path after the port: nginx passes the request URI through
    # unmodified, including the /kiwix/ prefix. kiwix-serve is started with
    # --urlRootLocation=/kiwix specifically so it expects that prefix and
    # generates its skin/asset links with it — stripping the prefix here
    # (a trailing "/" on proxy_pass) would make the two disagree.
    proxy_pass http://127.0.0.1:8080;
    proxy_buffering off;
  }
}
